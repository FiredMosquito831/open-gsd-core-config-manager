<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSD Config Manager</title>
<style>
  :root {
    color-scheme: dark light;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #14161a;
    color: #e7e9ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 32rem;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
  }
  p.tagline {
    color: #9aa0a6;
    margin-top: 0;
    margin-bottom: 1.5rem;
  }
  #status {
    border: 1px solid #2a2d33;
    border-radius: 8px;
    padding: 1rem;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .warn { color: #facc15; }
</style>
</head>
<body>
<main>
  <h1>GSD Config Manager</h1>
  <p class="tagline">The real config editor arrives in Phase 3. This bootstrap page only verifies the local helper connection.</p>
  <div id="status">Checking connection&hellip;</div>
</main>
<script>
(function () {
  "use strict";

  // Step 1: read the one-time launch token from the URL, once.
  var token = new URLSearchParams(location.search).get("t");

  // Step 2: immediately strip it from the address bar so it never persists
  // into browser history, bookmarks, or a Referer header. The token is kept
  // only in this module-scoped variable for the lifetime of the page - it is
  // never written to any browser storage API.
  history.replaceState({}, "", location.pathname);

  var statusEl = document.getElementById("status");

  function setStatus(html, cls) {
    statusEl.className = cls || "";
    statusEl.innerHTML = html;
  }

  if (!token) {
    // Step 5: no token present at all - do not attempt the API call.
    setStatus(
      "No launch token found. Open the URL the CLI printed in your terminal to connect.",
      "warn"
    );
    return;
  }

  // Step 3: the token travels as a header on the API call, never as a query
  // parameter - query strings land in server request logs, headers do not.
  fetch("/api/health", { headers: { "x-gsd-token": token } })
    .then(function (res) {
      if (res.status === 403) {
        setStatus(
          "The launch token was missing or invalid. Re-open the URL the CLI printed in your terminal.",
          "err"
        );
        return null;
      }
      if (!res.ok) {
        setStatus("Unexpected response from the local helper (status " + res.status + ").", "err");
        return null;
      }
      return res.json();
    })
    .then(function (body) {
      if (!body) return;
      if (body.ok) {
        var version = body.version ? " (v" + body.version + ")" : "";
        setStatus("Connected to the local helper" + version + ".", "ok");
      } else {
        setStatus("The local helper reported an error.", "err");
      }
    })
    .catch(function () {
      setStatus("Could not reach the local helper. Is it still running?", "err");
    });
})();
</script>
</body>
</html>
